services:
  postgres:
    image: postgres:16-alpine
    container_name: pantry_planner_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pantry_macro_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pantry_macro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: